name: limit_it_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+3

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any


  cupertino_icons: ^1.0.8
  go_router:
  flutter_svg: ^2.0.16
  lottie:
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.3
  get: ^4.6.6
  mime: ^1.0.0
  mime_type: ^1.0.1
  flutter_spinkit: ^5.2.1
  toastification:
  quickalert: ^1.1.0
  country_pickers: ^3.0.1
  video_player: ^2.10.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  device_preview:
  internet_connection_checker_plus: ^2.5.2
  usage_stats: ^1.3.1
  permission_handler: ^11.3.1
  installed_apps: ^2.1.1
  google_mobile_ads: ^5.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter_html: ^3.0.0-beta.2
  in_app_purchase: ^3.2.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons:
  image: ^4.5.4

flutter_launcher_icons:

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/appLogo.png"
  adaptive_icon_foreground: "assets/icons/appLogo.png"
  adaptive_icon_background: "#214432"


flutter_gen:
  output: lib/global/custom_assets/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true


flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/


  # example:
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Bold.otf
        - asset: assets/fonts/GeneralSans-Regular.otf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
